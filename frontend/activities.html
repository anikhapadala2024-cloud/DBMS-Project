<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultivation Activities - AgriTech Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div id="app-sidebar-container"></div>
    <div class="app-main">
      <div id="app-topbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Cultivation Activities Log</h1>
            <p class="page-subtitle">Record and audit field operations: irrigation schedules, fertilizer doses, pest control, and harvests</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-agri-primary" onclick="openAddActivityModal()">
              <i class="fas fa-plus-circle"></i>Log Field Activity
            </button>
            <button class="btn btn-agri-outline" onclick="exportActivitiesCsv()">
              <i class="fas fa-file-csv"></i>Export CSV
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div style="min-width: 220px;">
            <select class="form-select filter-input" id="filterBatchSelect" onchange="loadActivities()">
              <option value="">All Crop Batches</option>
            </select>
          </div>
          <div style="min-width: 170px;">
            <select class="form-select filter-input" id="filterTypeSelect" onchange="loadActivities()">
              <option value="">All Activity Types</option>
              <option value="Irrigation">Irrigation</option>
              <option value="Fertilization">Fertilization</option>
              <option value="Pest/Disease">Pest/Disease</option>
              <option value="Harvesting">Harvesting</option>
            </select>
          </div>
          <div class="d-flex align-items-center gap-1">
            <input type="date" id="filterDateFrom" class="form-control filter-input py-1" title="From Date" onchange="loadActivities()">
            <span class="text-muted small">to</span>
            <input type="date" id="filterDateTo" class="form-control filter-input py-1" title="To Date" onchange="loadActivities()">
          </div>
          <button class="btn btn-agri-outline" onclick="resetActivityFilters()">
            <i class="fas fa-undo"></i>Reset
          </button>
        </div>

        <!-- Activities Data Table -->
        <div class="agri-card">
          <div class="agri-card-body p-0">
            <div class="table-responsive-custom">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th># ID</th>
                    <th>Activity Date</th>
                    <th>Activity Type</th>
                    <th>Linked Batch</th>
                    <th>Farmer & Crop</th>
                    <th>Resource / Quantity Used</th>
                    <th>Description & Notes</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="activitiesTableBody">
                  <tr><td colspan="8" class="text-center py-4 text-muted">Loading activities...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Activity Modal -->
  <div class="modal fade" id="activityModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="activityModalTitle"><i class="fas fa-clipboard-check me-2 text-success"></i>Log Cultivation Activity</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="activityForm" onsubmit="saveActivity(event)">
          <div class="modal-body">
            <input type="hidden" id="activityId">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="activityBatchSelect" class="form-label small fw-bold">Target Crop Batch</label>
                <select class="form-select" id="activityBatchSelect">
                  <option value="">Select batch (optional for manual crop tracking)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="activityCropName" class="form-label small fw-bold">Target Crop Name</label>
                <input type="text" class="form-control" id="activityCropName" placeholder="e.g. Paddy, Turmeric, Maize" maxlength="120">
              </div>
              <div class="col-md-6">
                <label for="activityTypeSelect" class="form-label small fw-bold">Activity Type *</label>
                <select class="form-select" id="activityTypeSelect" required onchange="onActivityTypeChange()">
                  <option value="Irrigation">Irrigation (Watering)</option>
                  <option value="Fertilization">Fertilization (Nutrients)</option>
                  <option value="Pest/Disease">Pest / Disease Treatment</option>
                  <option value="Harvesting">Harvesting (Crop Yield)</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="activityDate" class="form-label small fw-bold">Execution Date *</label>
                <input type="date" class="form-control" id="activityDate" required>
              </div>
              <div class="col-md-4">
                <label for="activityQuantity" class="form-label small fw-bold" id="activityQtyLabel">Quantity Used *</label>
                <input type="number" step="0.1" min="0" class="form-control" id="activityQuantity" placeholder="e.g. 5000" required>
              </div>
              <div class="col-md-4">
                <label for="activityUnit" class="form-label small fw-bold" id="activityUnitLabel">Unit of Measurement *</label>
                <input type="text" class="form-control" id="activityUnit" placeholder="e.g. Liters, Kg, Bags, Hours" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="activityDescription" class="form-label small fw-bold">Operation Description & Observations *</label>
              <textarea class="form-control" id="activityDescription" rows="3" placeholder="Describe the treatment, observations, water source, or chemical name..." required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-agri-primary" id="saveActivityBtn">Record Activity</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/activities.js"></script>
</body>
</html>
