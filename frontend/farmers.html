<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmers Management - AgriTech Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div id="app-sidebar-container"></div>
    <div class="app-main">
      <div id="app-topbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Farmers Directory</h1>
            <p class="page-subtitle">Manage registered agricultural producers, their village locations, and profiles</p>
          </div>
          <div>
            <button class="btn btn-agri-primary" data-role="admin" onclick="openAddFarmerModal()">
              <i class="fas fa-user-plus"></i>Add New Farmer
            </button>
          </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="filter-bar">
          <div class="flex-grow-1" style="min-width: 250px;">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
              <input type="text" id="farmerSearchInput" class="form-control border-start-0 ps-0" placeholder="Search by name, phone, village, address..." oninput="handleFarmerSearch()">
            </div>
          </div>
          <button class="btn btn-agri-outline" onclick="loadFarmers(1)">
            <i class="fas fa-sync-alt"></i>Refresh
          </button>
        </div>

        <!-- Farmers Data Table -->
        <div class="agri-card">
          <div class="agri-card-body p-0">
            <div class="table-responsive-custom">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th># ID</th>
                    <th>Farmer Name</th>
                    <th>Phone Contact</th>
                    <th>Village</th>
                    <th>Address</th>
                    <th>Assigned Fields</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="farmersTableBody">
                  <tr><td colspan="7" class="text-center py-4 text-muted">Loading farmers...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Pagination Bar -->
          <div class="agri-card-header bg-light py-3 d-flex justify-content-between align-items-center">
            <span class="small text-muted" id="paginationInfo">Showing 0 of 0 farmers</span>
            <div class="btn-group" id="paginationBtns"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Farmer Modal -->
  <div class="modal fade" id="farmerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="farmerModalTitle"><i class="fas fa-user-plus me-2 text-success"></i>Add Farmer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="farmerForm" onsubmit="saveFarmer(event)">
          <div class="modal-body">
            <input type="hidden" id="farmerId">
            <div class="mb-3">
              <label for="farmerName" class="form-label small fw-bold">Full Name *</label>
              <input type="text" class="form-control" id="farmerName" placeholder="e.g. Ramesh Kumar Patel" required>
            </div>
            <div class="mb-3">
              <label for="farmerPhone" class="form-label small fw-bold">Phone Number *</label>
              <input type="text" class="form-control" id="farmerPhone" placeholder="e.g. +91 98765 43210" required>
            </div>
            <div class="mb-3">
              <label for="farmerVillage" class="form-label small fw-bold">Village / Region *</label>
              <input type="text" class="form-control" id="farmerVillage" placeholder="e.g. Greenfield Agro Colony" required>
            </div>
            <div class="mb-3">
              <label for="farmerAddress" class="form-label small fw-bold">Full Address *</label>
              <textarea class="form-control" id="farmerAddress" rows="2" placeholder="e.g. House No. 24, Canal Road" required></textarea>
            </div>
            <div class="row g-2">
              <div class="col-md-6">
                <label for="farmerLandSize" class="form-label small fw-bold">Land Size (Acres)</label>
                <input type="number" step="0.1" min="0" class="form-control" id="farmerLandSize" placeholder="e.g. 5.5">
              </div>
              <div class="col-md-6">
                <label for="farmerSoilType" class="form-label small fw-bold">Soil Type</label>
                <input type="text" class="form-control" id="farmerSoilType" placeholder="e.g. Black soil, loam">
              </div>
            </div>
            <div class="row g-2 mt-0">
              <div class="col-md-6">
                <label for="farmerPreferredCrop" class="form-label small fw-bold">Preferred Crop</label>
                <input type="text" class="form-control" id="farmerPreferredCrop" placeholder="e.g. Paddy / Turmeric">
              </div>
              <div class="col-md-6">
                <label for="farmerPhotoUrl" class="form-label small fw-bold">Profile / Farm Photo URL</label>
                <input type="url" class="form-control" id="farmerPhotoUrl" placeholder="https://example.com/photo.jpg">
              </div>
            </div>
            <div class="mt-3">
              <label for="farmerFarmNotes" class="form-label small fw-bold">Farm Notes</label>
              <textarea class="form-control" id="farmerFarmNotes" rows="2" placeholder="Irrigation source, crop cycle, seasonal notes..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-agri-primary" id="saveFarmerBtn">Save Farmer Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Farmer Details Modal -->
  <div class="modal fade" id="farmerDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-id-card me-2 text-success"></i>Farmer Profile & Associated Holdings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="farmerDetailsBody">
          <p class="text-center text-muted">Loading profile...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/farmers.js"></script>
</body>
</html>
