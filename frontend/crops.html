<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crops Catalog - AgriTech Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div id="app-sidebar-container"></div>
    <div class="app-main">
      <div id="app-topbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Crop Catalog & Botanical Varieties</h1>
            <p class="page-subtitle">Manage crop varieties, expected harvest benchmarks, and seasonal cycles</p>
          </div>
          <div>
            <button class="btn btn-agri-primary" data-role="admin" onclick="openAddCropModal()">
              <i class="fas fa-plus-circle"></i>Add New Crop
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="flex-grow-1" style="min-width: 250px;">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
              <input type="text" id="cropSearchInput" class="form-control border-start-0 ps-0" placeholder="Search by crop name, type, season..." oninput="handleCropSearch()">
            </div>
          </div>
          <button class="btn btn-agri-outline" onclick="loadCrops()">
            <i class="fas fa-sync-alt"></i>Refresh
          </button>
        </div>

        <!-- Crops Data Table -->
        <div class="agri-card">
          <div class="agri-card-body p-0">
            <div class="table-responsive-custom">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th># ID</th>
                    <th>Crop Name</th>
                    <th>Crop Classification</th>
                    <th>Optimal Season</th>
                    <th>Benchmark Yield (Per Acre)</th>
                    <th>Batches Count</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="cropsTableBody">
                  <tr><td colspan="7" class="text-center py-4 text-muted">Loading crop catalog...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Crop Modal -->
  <div class="modal fade" id="cropModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="cropModalTitle"><i class="fas fa-seedling me-2 text-success"></i>Add Crop Variety</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="cropForm" onsubmit="saveCrop(event)">
          <div class="modal-body">
            <input type="hidden" id="cropId">
            <div class="mb-3">
              <label for="cropName" class="form-label small fw-bold">Crop Variety Name *</label>
              <input type="text" class="form-control" id="cropName" placeholder="e.g. Golden Sharbati Wheat" required>
            </div>
            <div class="mb-3">
              <label for="cropType" class="form-label small fw-bold">Crop Classification / Type *</label>
              <select class="form-select" id="cropType" required>
                <option value="Cereal">Cereal (Wheat, Rice, Maize, etc.)</option>
                <option value="Pulse">Pulse / Legume (Soybean, Chickpea, Lentil)</option>
                <option value="Cash Crop">Cash Crop (Cotton, Sugarcane, Tobacco)</option>
                <option value="Vegetable">Vegetable (Tomato, Onion, Potato)</option>
                <option value="Fruit">Fruit / Orchard</option>
                <option value="Oilseed">Oilseed (Mustard, Groundnut, Sunflower)</option>
              </select>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label for="cropSeason" class="form-label small fw-bold">Agricultural Season *</label>
                <select class="form-select" id="cropSeason" required>
                  <option value="Kharif">Kharif (Monsoon / Summer)</option>
                  <option value="Rabi">Rabi (Winter / Spring)</option>
                  <option value="Zaid">Zaid (Early Summer)</option>
                  <option value="Year-Round">Year-Round</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label for="cropYield" class="form-label small fw-bold">Expected Yield (Q/Acre) *</label>
                <input type="number" step="0.1" min="0.1" class="form-control" id="cropYield" placeholder="e.g. 25.0" required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-agri-primary" id="saveCropBtn">Save Crop Variety</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/crops.js"></script>
</body>
</html>
